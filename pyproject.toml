[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vacation-planner"
version = "1.0.0"
description = "A modern Python desktop application for planning vacations and road trips."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "folium==0.16.0",
    "pandas==2.2.3",
    "requests==2.32.3",
    "geopy==2.4.1",
    "customtkinter==5.2.2",
]

[project.optional-dependencies]
build = [
    "pyinstaller",
]

[project.scripts]
vacation-planner = "src.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
