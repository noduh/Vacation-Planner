name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    
    runs-on: ${{ matrix.os }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Get VERSION from source
      id: get_version
      shell: bash
      run: |
        VERSION=$(python -c "
        import re, sys
        m = re.search(r'VERSION\s*=\s*\"([^\"]+)\"', open('src/version.py').read())
        if not m:
            print('ERROR: could not find VERSION in src/version.py', file=sys.stderr); sys.exit(1)
        print(m.group(1))
        ")
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        
    - name: Install System Dependencies (Linux only)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-tk
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install ".[build]"
        
    - name: Build executable (Linux / macOS)
      if: runner.os != 'Windows'
      run: |
        pyinstaller --noconfirm --onefile --windowed \
          --name "VacationPlanner-${{ steps.get_version.outputs.version }}-$RUNNER_OS" \
          --add-data "src/data:data" \
          --hidden-import src.api_client \
          --hidden-import src.map_renderer \
          --collect-all customtkinter \
          --collect-all folium \
          --collect-all branca \
          --collect-all geopy \
          --collect-all pandas \
          --collect-all requests \
          VacationPlanner.py
          
    - name: Build executable (Windows)
      if: runner.os == 'Windows'
      run: |
        pyinstaller --noconfirm --onefile --windowed `
          --name "VacationPlanner-${{ steps.get_version.outputs.version }}-$env:RUNNER_OS" `
          --add-data "src/data;data" `
          --hidden-import src.api_client `
          --hidden-import src.map_renderer `
          --collect-all customtkinter `
          --collect-all folium `
          --collect-all branca `
          --collect-all geopy `
          --collect-all pandas `
          --collect-all requests `
          VacationPlanner.py
          
    - name: Get Built File Name
      id: binary_name
      shell: bash
      run: |
        VERSION=${{ steps.get_version.outputs.version }}
        if [ "$RUNNER_OS" == "Windows" ]; then
          echo "file=dist/VacationPlanner-$VERSION-Windows.exe" >> $GITHUB_OUTPUT
        else
          echo "file=dist/VacationPlanner-$VERSION-$RUNNER_OS" >> $GITHUB_OUTPUT
        fi

    - name: Attach Binary to GitHub Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: ${{ steps.binary_name.outputs.file }}
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Upload Binary as Build Artifact (Manual Run)
      uses: actions/upload-artifact@v4
      if: github.event_name == 'workflow_dispatch'
      with:
        name: VacationPlanner-${{ runner.os }}
        path: ${{ steps.binary_name.outputs.file }}
