name: Build and Release

on:
  push:
    tags:
      - 'v*' # Automatically create a release when you push a tag like 'v1.0'
  workflow_dispatch: # Allow manual triggering from the GitHub Actions tab

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
        
    - name: Build Linux executable
      run: |
        pyinstaller --noconfirm --onefile --name "TripPlanner-Linux-x86_64" \
          --add-data "src:src" \
          --add-data "data:data" \
          --copy-metadata streamlit \
          --collect-all streamlit \
          --collect-all folium \
          --collect-all branca \
          --collect-all streamlit_folium \
          run_app.py
          
    - name: Attach Binary to GitHub Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: dist/TripPlanner-Linux-x86_64
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Upload Binary as Build Artifact (Manual Run)
      uses: actions/upload-artifact@v4
      if: github.event_name == 'workflow_dispatch'
      with:
        name: TripPlanner-Linux-Executable
        path: dist/TripPlanner-Linux-x86_64
