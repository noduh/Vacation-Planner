name: Build and Release

on:
  push:
    tags:
      - 'v*' # Automatically create a release when you push a tag like 'v1.0'
  workflow_dispatch: # Allow manual triggering from the GitHub Actions tab

permissions:
  contents: write

jobs:
  build-and-release:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    
    runs-on: ${{ matrix.os }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
        
    - name: Install System Dependencies (Linux only)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-tk
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
        
    - name: Build executable (Linux / macOS)
      if: runner.os != 'Windows'
      run: |
        pyinstaller --noconfirm --onefile --windowed --name "VacationPlanner-${{ runner.os }}" \
          --paths src \
          --hidden-import api_client \
          --hidden-import map_renderer \
          --collect-all customtkinter \
          --collect-all folium \
          --collect-all branca \
          --collect-all geopy \
          --collect-all pandas \
          --collect-all requests \
          VacationPlanner.py
          
    - name: Build executable (Windows)
      if: runner.os == 'Windows'
      run: |
        pyinstaller --noconfirm --onefile --windowed --name "VacationPlanner-${{ runner.os }}" `
          --paths src `
          --hidden-import api_client `
          --hidden-import map_renderer `
          --collect-all customtkinter `
          --collect-all folium `
          --collect-all branca `
          --collect-all geopy `
          --collect-all pandas `
          --collect-all requests `
          VacationPlanner.py
          
    - name: Get Built File Name
      id: binary_name
      shell: bash
      run: |
        if [ "$RUNNER_OS" == "Windows" ]; then
          echo "file=dist/VacationPlanner-Windows.exe" >> $GITHUB_OUTPUT
        else
          echo "file=dist/VacationPlanner-$RUNNER_OS" >> $GITHUB_OUTPUT
        fi

    - name: Attach Binary to GitHub Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: ${{ steps.binary_name.outputs.file }}
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Upload Binary as Build Artifact (Manual Run)
      uses: actions/upload-artifact@v4
      if: github.event_name == 'workflow_dispatch'
      with:
        name: VacationPlanner-${{ runner.os }}
        path: ${{ steps.binary_name.outputs.file }}
